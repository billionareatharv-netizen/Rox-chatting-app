<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ROXX SOCIAL</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              "primary": "#330df2",
              "background-light": "#f6f5f8",
              "background-dark": "#0a090f",
              "card-dark": "#1a1826",
              "border-dark": "#2d2d2d",
            },
            fontFamily: {
              "display": ["Spline Sans", "sans-serif"]
            },
            borderRadius: {
              "DEFAULT": "1rem",
              "lg": "2rem",
              "xl": "3rem",
              "full": "9999px"
            },
            animation: {
                'spin-slow': 'spin 10s linear infinite',
                'float': 'float 3s ease-in-out infinite',
            },
            keyframes: {
                float: {
                    '0%, 100%': { transform: 'translate(-50%, -60%)' },
                    '50%': { transform: 'translate(-50%, -40%)' },
                }
            }
          }
        }
      }
    </script>
    <style>
      body {
        font-family: 'Spline Sans', sans-serif;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      .glass {
        background: rgba(26, 24, 38, 0.7);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-top: 1px solid rgba(255, 255, 255, 0.05);
      }
      .header-glass {
        background: rgba(10, 9, 15, 0.85);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      }
      .message-gradient {
        background: linear-gradient(135deg, #330df2 0%, #6d28d9 100%);
      }
      .glow-button {
        box-shadow: 0 0 15px rgba(51, 13, 242, 0.4);
      }
      .bg-pattern {
        background-image: radial-gradient(#1e1b2e 0.5px, transparent 0.5px);
        background-size: 24px 24px;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@18.2.0/",
    "react/": "https://esm.sh/react@18.2.0/",
    "react": "https://esm.sh/react@18.2.0",
    "@google/genai": "https://esm.sh/@google/genai@1.34.0",
    "firebase/app": "https://esm.sh/firebase@10.14.1/app",
    "firebase/auth": "https://esm.sh/firebase@10.14.1/auth",
    "firebase/firestore": "https://esm.sh/firebase@10.14.1/firestore",
    "firebase/storage": "https://esm.sh/firebase@10.14.1/storage",
    "firebase/": "https://esm.sh/firebase@^12.9.0/"
  }
}
</script>
</head>
  <body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-white">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
